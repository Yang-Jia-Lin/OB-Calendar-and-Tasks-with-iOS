<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>简洁待办计时 · 交互预览</title>
<link rel="stylesheet" href="/styles.css">
<style>
:root { --font-monospace:Consolas,"SFMono-Regular",monospace; --text-normal:#28333e; --text-muted:#7a838d; --text-faint:#aeb5bd; --text-error:#ac4e4e; --text-on-accent:white; --background-primary:#fff; --background-secondary:#f7f8fa; --background-modifier-border:#e5e8ed; --interactive-accent:#4d7295; }
* { box-sizing:border-box; } body { margin:0; background:var(--background-primary); color:var(--text-normal); font-family:"Segoe UI","Microsoft YaHei",sans-serif; } button,input,select { font:inherit; color:var(--text-normal); background:var(--background-primary); border:1px solid var(--background-modifier-border); border-radius:5px; padding:5px 9px; } input,select { min-height:32px; } button { cursor:pointer; } button:hover { filter:brightness(.97); } button:focus-visible,input:focus-visible,select:focus-visible { outline:2px solid var(--interactive-accent); outline-offset:2px; } input[type=checkbox] { min-height:unset; accent-color:var(--interactive-accent); }
.preview-banner { padding:10px 24px; border-bottom:1px solid var(--background-modifier-border); background:var(--background-secondary); color:var(--text-muted); display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:center; font-size:12px; } .preview-tools { display:flex; gap:12px; align-items:center; flex-wrap:wrap; } .preview-tools label { display:flex; align-items:center; gap:5px; } #status { padding:10px 24px; font-size:12px; color:var(--text-muted); border-top:1px solid var(--background-modifier-border); } dialog { width:min(460px,94vw); background:var(--background-primary); color:var(--text-normal); border:1px solid var(--background-modifier-border); border-radius:12px; padding:25px; box-shadow:0 12px 80px #0002; } dialog::backdrop { background:#0003; } dialog h2 { font-size:20px; margin:0; } #notifications { position:fixed; bottom:24px; right:24px; display:grid; gap:8px; z-index:20; } .toast { font-size:13px; padding:12px 18px; background:var(--background-secondary); border:1px solid var(--background-modifier-border); border-radius:6px; box-shadow:0 3px 15px #0001; max-width:360px; }
.theme-dark { --text-normal:#d6dce2; --text-muted:#939eaa; --text-faint:#626d77; --text-error:#e08d8d; --background-primary:#202327; --background-secondary:#272b30; --background-modifier-border:#383e45; --interactive-accent:#668cb1; }
</style></head><body>
<div class="preview-banner"><span>交互预览 · 使用示例数据，不连接你的 iCloud</span><div class="preview-tools"><label><input id="simulate-offline" type="checkbox">模拟断网</label><label><input id="dark-mode" type="checkbox">深色</label><button id="reset-preview">重置示例</button></div></div>
<main id="app"></main><footer id="status"></footer><div id="notifications" aria-live="polite"></div>
<script src="/Preview/mock-obsidian.js"></script><script src="/dist/simple-task-timer/main.js"></script>
<script>__startPreview().catch(e=>{ document.getElementById('app').textContent=e.stack; console.error(e); });</script>
</body></html>
