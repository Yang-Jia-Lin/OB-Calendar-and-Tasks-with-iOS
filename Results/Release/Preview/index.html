<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日历与待办计时 · v0.3.2 交互预览</title>
<link rel="stylesheet" href="./styles.css"><style>
:root { --font-interface: 'Segoe UI','Microsoft YaHei',system-ui,sans-serif; --text-normal:#303844; --text-muted:#7f8792; --text-faint:#b0b7c1; --text-error:#ba4b52; --text-on-accent:#fff; --background-primary:#fff; --background-secondary:#f7f8fa; --background-modifier-border:#e7e9ed; --background-modifier-hover:#eef1f5; --interactive-accent:#537d92; }
.theme-dark { --text-normal:#e0e5eb; --text-muted:#949eab; --text-faint:#5b6570; --text-error:#ef9397; --text-on-accent:#fff; --background-primary:#1d2127; --background-secondary:#242931; --background-modifier-border:#343c47; --background-modifier-hover:#303844; --interactive-accent:#6f9eb4; }
* { box-sizing:border-box; } body { margin:0; background:var(--background-primary); color:var(--text-normal); font-family:var(--font-interface); height:100dvh; display:flex; flex-direction:column; }
button,input,select { color:var(--text-normal); background:var(--background-primary); border:1px solid var(--background-modifier-border); font-family:inherit; padding:5px 8px; } button { cursor:pointer; } input[type=checkbox] { accent-color:var(--interactive-accent); }
.preview-toolbar { min-height:35px; flex-shrink:0; border-bottom:1px solid var(--background-modifier-border); color:var(--text-muted); display:flex; gap:14px; align-items:center; justify-content:space-between; flex-wrap:wrap; padding:6px 18px; font-size:11px; }
.preview-toolbar div { display:flex; align-items:center; gap:12px; }.preview-toolbar label { display:flex; align-items:center; gap:4px; }.preview-toolbar button { font-size:11px; padding:2px 7px; border-radius:4px; }
#app { flex:1; min-height:0; } dialog { width:min(470px,calc(100vw - 26px)); max-height:90dvh; overflow:auto; border:1px solid var(--background-modifier-border); border-radius:14px; padding:24px; background:var(--background-primary); color:var(--text-normal); box-shadow:0 20px 90px #0003; } dialog::backdrop { background:#0005; } dialog h2 { margin:0 0 18px; font-size:20px; }
#toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); z-index:10; max-width:90vw; padding:10px 16px; font-size:12px; border:1px solid var(--background-modifier-border); background:var(--background-secondary); border-radius:8px; box-shadow:0 5px 30px #0001; } #toast:empty { display:none; }
.preview-status-bar { flex-shrink:0; min-height:26px; border-top:1px solid var(--background-modifier-border); display:flex; justify-content:flex-end; align-items:center; padding:3px 18px; font-size:12px; color:var(--text-muted); }
</style></head><body><aside class="preview-toolbar"><span>v0.3.2 交互预览 · 示例数据 · 不连接真实 iCloud</span><div><label>同步延迟 <select id="sync-delay" aria-label="模拟同步延迟"><option value="0">即时</option><option value="10000">10 秒</option></select></label><label><input id="offline" type="checkbox">模拟断网</label><label><input id="theme" type="checkbox">深色</label><button id="reset">重置示例</button></div></aside><main id="app"></main><footer class="preview-status-bar"><span id="preview-status"></span></footer><div id="toast" role="status"></div><script src="./app.js"></script></body></html>
